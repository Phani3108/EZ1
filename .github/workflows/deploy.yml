name: Deploy to Production

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          # PH2-12: post-consolidation deploy matrix. Five service images
          # (down from 10). school-service / student-service /
          # attendance-service / assessment-service merged into academics
          # (PH2-6 → PH2-10). notification-worker folded into
          # communications (PH2-4). reporting-service now a Kafka consumer.
          - api-gateway
          - identity
          - academics
          - finance
          - communications
          - reporting-service
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image prefix
        id: prefix
        run: |
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image_prefix=ghcr.io/${OWNER_LC}/eduzim" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ steps.prefix.outputs.image_prefix }}-${{ matrix.service }}:${{ github.sha }}
            ${{ steps.prefix.outputs.image_prefix }}-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy notification
        run: |
          echo "🚀 Images pushed to GHCR."
          echo "To deploy, update your docker-compose.prod.yml or Kubernetes manifests"
          echo "with image tag: ${{ github.sha }}"
