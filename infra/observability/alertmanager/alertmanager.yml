# Alertmanager routing — PH6-1 / Phase 6.
#
# Routes:
#   * `severity: critical` → pages on-call (email + Slack #ops-pages)
#   * `severity: warning`  → emails the engineering list (no page)
#
# Notification channels are env-substituted at container start so the
# repo doesn't ship real webhooks. Set in .env:
#
#   ALERT_SLACK_WEBHOOK_OPS_PAGES   (critical channel)
#   ALERT_SLACK_WEBHOOK_OPS_DIGEST  (warning channel)
#   ALERT_EMAIL_FROM
#   ALERT_EMAIL_TO_ENG
#   ALERT_SMTP_HOST / ALERT_SMTP_USER / ALERT_SMTP_PASSWORD

global:
  resolve_timeout: 5m
  smtp_smarthost: ${ALERT_SMTP_HOST:-smtp.example.com:587}
  smtp_from: ${ALERT_EMAIL_FROM:-alerts@eduzim.invalid}
  smtp_auth_username: ${ALERT_SMTP_USER:-}
  smtp_auth_password: ${ALERT_SMTP_PASSWORD:-}
  smtp_require_tls: true

# Suppress noise: when a critical fires, don't ALSO send the warning
# for the same alertname/instance.
inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: [alertname, instance, service]

route:
  receiver: ops-warning-default
  group_by: [alertname, service, component]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = critical
      receiver: ops-page
      group_wait: 10s         # critical fires fast
      repeat_interval: 1h     # keep paging until ack'd

receivers:
  - name: ops-page
    slack_configs:
      - api_url: ${ALERT_SLACK_WEBHOOK_OPS_PAGES:-https://hooks.slack.invalid/}
        channel: "#ops-pages"
        title: "🚨 {{ .GroupLabels.alertname }} ({{ .GroupLabels.service }})"
        text: |
          *Severity:* {{ .CommonLabels.severity }}
          *Component:* {{ .CommonLabels.component }}
          {{ range .Alerts }}*{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          {{ end }}
        send_resolved: true
    email_configs:
      - to: ${ALERT_EMAIL_TO_ENG:-eng@eduzim.invalid}
        send_resolved: true

  - name: ops-warning-default
    slack_configs:
      - api_url: ${ALERT_SLACK_WEBHOOK_OPS_DIGEST:-https://hooks.slack.invalid/}
        channel: "#ops-digest"
        title: "⚠️ {{ .GroupLabels.alertname }}"
        text: |
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ end }}
        send_resolved: true
