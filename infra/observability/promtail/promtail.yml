# Promtail config — INFRA-009 / Phase 6.
#
# Scrapes Docker container stdout/stderr (Docker's json-file driver
# writes to /var/lib/docker/containers/*.log on the host). Ships to
# Loki with labels derived from compose project / service / container
# name so queries can scope by service.
#
# Each EduZim service logs structured JSON via eduzim_shared.logging
# (ADR 007). Promtail's `json` stage parses those JSON fields so they
# become Loki labels (level, request_id, trace_id, etc.).

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    backoff_config:
      min_period: 500ms
      max_period: 5m
      max_retries: 10

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s

    relabel_configs:
      # Use the compose service name (e.g. "academics") as the `service`
      # label rather than the full container name (e.g. "eduzim-academics").
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'project'
      - source_labels: ['__meta_docker_container_name']
        target_label: 'container'

    pipeline_stages:
      # Try to parse as JSON. Lines that aren't valid JSON (e.g. uvicorn
      # access logs at startup) fall through to the `output` stage and
      # ship as-is with the default labels.
      - json:
          expressions:
            level:       level
            request_id:  request_id
            trace_id:    trace_id
            span_id:     span_id
            message:     message
            logger:      logger
            module:      module
            function:    function

      # Promote parsed JSON fields to Loki labels so they're indexed
      # (cardinality is bounded — level is one of 5 values, logger is
      # typically <20 distinct values).
      - labels:
          level:
          logger:

      # Set the timestamp from the JSON `timestamp` field if present;
      # else use the container's ingestion timestamp.
      - timestamp:
          source: timestamp
          format: RFC3339Nano
          fallback_formats:
            - RFC3339
          action_on_failure: skip
