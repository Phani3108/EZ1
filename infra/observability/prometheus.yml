# EduZim — Prometheus scrape config (INFRA-007 / Phase 6)
# =====================================================================
# Phase 6 expansion: every service exposes /metrics via
# eduzim_shared.metrics.install (wired in app_factory.create_app).
# This file scrapes them all, plus the gateway's existing /metrics.
#
# Production wiring (Phase 7+ / k8s) replaces this with
# kube-prometheus-stack ServiceMonitor objects. For local + staging
# docker-compose, this file is the source of truth.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: eduzim
    environment: ${ENVIRONMENT:-dev}

# Alertmanager wiring — picked up when the alertmanager container is up
# (docker-compose.observability.yml overlay). When the container is
# down (single-node docker-compose.yml without the overlay), Prometheus
# logs a benign "no alertmanager available" warning and keeps scraping.
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Rule files are mounted into the prometheus container; PH6-1
# alertmanager-rules live here.
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: api-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["api-gateway:8000"]
        labels:
          service: api-gateway
          tier: edge

  - job_name: identity
    metrics_path: /metrics
    static_configs:
      - targets: ["identity:8000"]
        labels:
          service: identity
          tier: core

  - job_name: academics
    metrics_path: /metrics
    static_configs:
      - targets: ["academics:8000"]
        labels:
          service: academics
          tier: core

  - job_name: finance
    metrics_path: /metrics
    static_configs:
      - targets: ["finance:8000"]
        labels:
          service: finance
          tier: core

  - job_name: communications
    metrics_path: /metrics
    static_configs:
      - targets: ["communications:8000"]
        labels:
          service: communications
          tier: core

  # reporting-service: only exposes /health (PH2-11 made it a pure
  # Kafka consumer). Its operational health is implicit in the
  # academics dashboard (when the consumer lags, academics' read
  # tiles freeze). We scrape /health for liveness only.
  - job_name: reporting-service-health
    metrics_path: /health
    static_configs:
      - targets: ["reporting-service:8000"]
        labels:
          service: reporting-service
          tier: consumer

  # Postgres exporter (added by docker-compose.observability.yml)
  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          tier: data

  # PgBouncer exporter (added by docker-compose.observability.yml)
  - job_name: pgbouncer-exporter
    static_configs:
      - targets: ["pgbouncer-exporter:9127"]
        labels:
          tier: data

  # Kafka JMX (HA overlay exposes JMX on each broker; the exporter
  # only resolves when HA is active. In single-node mode this scrape
  # silently errors — that's the design).
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]
        labels:
          tier: queue
