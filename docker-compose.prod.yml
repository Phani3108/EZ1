# EduZim — Production Deployment Stack
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# Prerequisites:
#   1. Copy .env.example → .env and fill in secrets
#   2. Set up DNS for your domain
#   3. Configure TLS via reverse proxy (Nginx/Caddy/Traefik)

version: "3.9"

services:
  # ─── Infrastructure ───
  postgres:
    image: postgres:16-alpine
    container_name: eduzim-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-eduzim}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: auth_db,school_db,student_db,attendance_db,fees_db,comms_db,reporting_db,assessment_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-eduzim}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eduzim-network

  redis:
    image: redis:7-alpine
    container_name: eduzim-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eduzim-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: eduzim-kafka
    restart: always
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    networks:
      - eduzim-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: eduzim-zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - eduzim-network

  # ─── Application Services ───
  api-gateway:
    image: ${IMAGE_REGISTRY:-ghcr.io/phani3108}/eduzim-api-gateway:${IMAGE_TAG:-latest}
    container_name: eduzim-gateway
    restart: always
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      AUTH_SERVICE_URL: http://auth-service:8000
      SCHOOL_SERVICE_URL: http://school-service:8000
      STUDENT_SERVICE_URL: http://student-service:8000
      ATTENDANCE_SERVICE_URL: http://attendance-service:8000
      FEES_SERVICE_URL: http://fees-service:8000
      COMMUNICATION_SERVICE_URL: http://communication-service:8000
      REPORTING_SERVICE_URL: http://reporting-service:8000
      ASSESSMENT_SERVICE_URL: http://assessment-service:8000
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/3
      REDIS_ENABLED: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:-https://admin.eduzim.co.zw,https://teacher.eduzim.co.zw,https://parent.eduzim.co.zw}
      ENFORCE_HTTPS: "true"
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    depends_on:
      - auth-service
      - redis
    networks:
      - eduzim-network

  auth-service:
    image: ${IMAGE_REGISTRY:-ghcr.io/phani3108}/eduzim-auth-service:${IMAGE_TAG:-latest}
    container_name: eduzim-auth
    restart: always
    environment:
      DATABASE_URL: postgresql://${DB_USER:-eduzim}:${DB_PASSWORD}@postgres:5432/auth_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_ENABLED: "true"
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL:-https://admin.eduzim.co.zw}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eduzim-network

  school-service:
    image: ${IMAGE_REGISTRY:-ghcr.io/phani3108}/eduzim-school-service:${IMAGE_TAG:-latest}
    container_name: eduzim-school
    restart: always
    environment:
      DATABASE_URL: postgresql://${DB_USER:-eduzim}:${DB_PASSWORD}@postgres:5432/school_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eduzim-network

  student-service:
    image: ${IMAGE_REGISTRY:-ghcr.io/phani3108}/eduzim-student-service:${IMAGE_TAG:-latest}
    container_name: eduzim-student
    restart: always
    environment:
      DATABASE_URL: postgresql://${DB_USER:-eduzim}:${DB_PASSWORD}@postgres:5432/student_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eduzim-network

  attendance-service:
    image: ${IMAGE_REGISTRY:-ghcr.io/phani3108}/eduzim-attendance-service:${IMAGE_TAG:-latest}
    container_name: eduzim-attendance
    restart: always
    environment:
      DATABASE_URL: postgresql://${DB_USER:-eduzim}:${DB_PASSWORD}@postgres:5432/attendance_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eduzim-network

  fees-service:
    image: ${IMAGE_REGISTRY:-ghcr.io/phani3108}/eduzim-fees-service:${IMAGE_TAG:-latest}
    container_name: eduzim-fees
    restart: always
    environment:
      DATABASE_URL: postgresql://${DB_USER:-eduzim}:${DB_PASSWORD}@postgres:5432/fees_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PAYNOW_INTEGRATION_ID: ${PAYNOW_INTEGRATION_ID}
      PAYNOW_INTEGRATION_KEY: ${PAYNOW_INTEGRATION_KEY}
      PAYNOW_RESULT_URL: ${PAYNOW_RESULT_URL:-https://api.eduzim.co.zw/api/v1/fees/payments/webhook/paynow}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eduzim-network

  communication-service:
    image: ${IMAGE_REGISTRY:-ghcr.io/phani3108}/eduzim-communication-service:${IMAGE_TAG:-latest}
    container_name: eduzim-comms
    restart: always
    environment:
      DATABASE_URL: postgresql://${DB_USER:-eduzim}:${DB_PASSWORD}@postgres:5432/comms_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eduzim-network

  reporting-service:
    image: ${IMAGE_REGISTRY:-ghcr.io/phani3108}/eduzim-reporting-service:${IMAGE_TAG:-latest}
    container_name: eduzim-reporting
    restart: always
    environment:
      DATABASE_URL: postgresql://${DB_USER:-eduzim}:${DB_PASSWORD}@postgres:5432/reporting_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      STUDENT_SERVICE_URL: http://student-service:8000
      ATTENDANCE_SERVICE_URL: http://attendance-service:8000
      FEES_SERVICE_URL: http://fees-service:8000
      ASSESSMENT_SERVICE_URL: http://assessment-service:8000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eduzim-network

  assessment-service:
    image: ${IMAGE_REGISTRY:-ghcr.io/phani3108}/eduzim-assessment-service:${IMAGE_TAG:-latest}
    container_name: eduzim-assessment
    restart: always
    environment:
      DATABASE_URL: postgresql://${DB_USER:-eduzim}:${DB_PASSWORD}@postgres:5432/assessment_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eduzim-network

  notification-worker:
    image: ${IMAGE_REGISTRY:-ghcr.io/phani3108}/eduzim-notification-worker:${IMAGE_TAG:-latest}
    container_name: eduzim-notifier
    restart: always
    environment:
      COMMS_DATABASE_URL: postgresql://${DB_USER:-eduzim}:${DB_PASSWORD}@postgres:5432/comms_db
      AUTH_DATABASE_URL: postgresql://${DB_USER:-eduzim}:${DB_PASSWORD}@postgres:5432/auth_db
      AFRICASTALKING_API_KEY: ${AFRICASTALKING_API_KEY}
      AFRICASTALKING_USERNAME: ${AFRICASTALKING_USERNAME:-sandbox}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      FCM_SERVER_KEY: ${FCM_SERVER_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eduzim-network

volumes:
  postgres_data:
  redis_data:

networks:
  eduzim-network:
    driver: bridge
